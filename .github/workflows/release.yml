name: CI & Auto Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: |
          python3 tests/test_send.py
          python3 tests/test_entry.py

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read plugin version
        id: ver
        run: |
          VERSION=$(sed -n 's/^# version = "\(.*\)"$/\1/p' opencreator_send_any.py | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Could not parse version from opencreator_send_any.py" >&2
            exit 1
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create tag and GitHub Release
        if: steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          CHANGELOG=$(gh api "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" -q .body)
          cat > release_notes.md <<EOF
          ## Install / Update

          **Linux / macOS (pinned to $TAG):**
          \`\`\`sh
          curl -fsSL "https://raw.githubusercontent.com/$REPO/$TAG/install.sh" | bash -s -- --ref "$TAG"
          \`\`\`

          **Latest \`main\`:**
          \`\`\`sh
          curl -fsSL "https://raw.githubusercontent.com/$REPO/main/install.sh" | bash
          \`\`\`

          **Manual install:** copy \`opencreator_send_any.py\` into \`orca_plugins/opencreator_send/\` inside OrcaSlicer's configuration folder (*Help > Show Configuration Folder*), then restart OrcaSlicer (2.5+).

          ---

          $CHANGELOG
          EOF

          gh release create "$TAG" \
            --title "OpenCreator Send $TAG" \
            --notes-file release_notes.md \
            opencreator_send_any.py \
            install.sh
